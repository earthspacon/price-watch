name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the site
        run: pnpm --filter @price-watch/web build
        env:
          # The Turnstile site key is public, it ships in the page.
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAGMNQCUUvRngLEVS
      - name: Apply database migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
      - name: Deploy the worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env production
